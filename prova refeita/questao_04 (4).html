        .titulo {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            letter-spacing: 2px;
            text-align: center;
        }

        #Cards {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            width: 22rem;
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(6px);
            background-color: rgba(255, 255, 255, 0.92);
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.6);
        }

        .card img {
            width: 100%;
            display: block;
            object-fit: cover;
            max-height: 300px;
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #003087;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background-color: #003087;
            color: white;
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card-text {
            font-size: 0.92rem;
            color: #333;
            line-height: 1.8;
        }

        .btn-add {
            background: linear-gradient(135deg, #003087, #0066cc);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-add:hover {
            background: linear-gradient(135deg, #0055b3, #0088ff);
            transform: scale(1.05);
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        .contador {
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            text-align: center;
        }
    </style>

                rank: '8,8',
                img: PAQUETA_IMG
            }
        ];

        let proximoJogador = 0;

        function add() {
            const areCards = document.getElementById('Cards');
            const contador = document.getElementById('contador');

            if (proximoJogador >= jogadoresDisponiveis.length) {
                alert('Todos os jogadores disponíveis já foram adicionados!');
                return;
            }

            const jogador = jogadoresDisponiveis[proximoJogador];

            const novoCard = document.createElement('div');
            novoCard.className = 'card';
            novoCard.innerHTML = `
                <img src="${jogador.img}" alt="${jogador.nome}">
                <div class="card-body">
                    <h5 class="card-title">
                        <span>${jogador.nome}</span>
                        <span class="badge">★ ${jogador.rank}</span>
                    </h5>
                    <p class="card-text">
                        <span><strong>Nascimento:</strong> ${jogador.nascimento}</span><br>
                        <span><strong>Altura:</strong> ${jogador.altura}</span><br>
                        <span><strong>Posição:</strong> ${jogador.posicao}</span>
                    </p>
                </div>
            `;

            areCards.appendChild(novoCard);

            proximoJogador++;
            const total = areCards.querySelectorAll('.card').length;
            contador.textContent = `${total} jogador${total > 1 ? 'es' : ''} na sua seleção`;
        }
    </script>
